<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="64" height="64">
  <defs>

    <!-- Controlled neon glow — tight halo, not a smear -->
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Extra-tight glow for small elements -->
    <filter id="tight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.65" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft ambient glow (background-only, no SourceGraphic) -->
    <filter id="ambient">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <!-- Inner panel: subtle radial depth -->
    <radialGradient id="panelGrad" cx="30%" cy="28%">
      <stop offset="0%"   stop-color="#1e1238"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </radialGradient>

    <!-- Dial face: dark inset -->
    <radialGradient id="dialGrad" cx="30%" cy="28%">
      <stop offset="0%"   stop-color="#15092c"/>
      <stop offset="100%" stop-color="#080516"/>
    </radialGradient>

  </defs>

  <!-- ── Background ── -->
  <rect width="36" height="36" fill="#090611"/>

  <!-- ── Ambient purple haze (sits behind vault, adds depth) ── -->
  <rect x="5" y="5" width="26" height="26" rx="3"
        fill="#7C3AED" opacity="0.22" filter="url(#ambient)"/>

  <!-- ── 3D shadow offset (bottom-right edge, dark) ── -->
  <rect x="4.5" y="4.5" width="28" height="28" rx="2.8"
        fill="none" stroke="#4C1D95" stroke-width="1.6" opacity="0.75"/>

  <!-- ── Inner panel (vault door face) ── -->
  <rect x="5.5" y="5.5" width="25" height="25" rx="2"
        fill="url(#panelGrad)"/>

  <!-- ── Main vault outline — neon purple, sharp then soft glow ── -->
  <rect x="3.5" y="3.5" width="29" height="29" rx="2.8"
        fill="none" stroke="#A855F7" stroke-width="1.8"
        filter="url(#neon)"/>

  <!-- ── Top-left highlight edges (bright accent) ── -->
  <line x1="6"   y1="3.5" x2="28.5" y2="3.5"
        stroke="#D8B4FE" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="3.5" y1="6"   x2="3.5"  y2="28.5"
        stroke="#D8B4FE" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>

  <!-- ── Left hardware ── -->

  <!-- Latch bar -->
  <rect x="1.8" y="16.5" width="5.5" height="3" rx="1.5"
        fill="#A855F7" filter="url(#tight)"/>
  <!-- Latch highlight strip -->
  <rect x="1.8" y="16.5" width="5.5" height="1" rx="0.5"
        fill="#D8B4FE" opacity="0.5"/>

  <!-- Upper bolt -->
  <circle cx="7" cy="10" r="1.5" fill="#A855F7" filter="url(#tight)"/>
  <circle cx="6.4" cy="9.4" r="0.5" fill="#D8B4FE" opacity="0.65"/>

  <!-- Lower bolt -->
  <circle cx="7" cy="26" r="1.5" fill="#A855F7" filter="url(#tight)"/>
  <circle cx="6.4" cy="25.4" r="0.5" fill="#D8B4FE" opacity="0.65"/>

  <!-- ── Combination dial ── -->

  <!-- Dial dark inset face -->
  <circle cx="18" cy="18" r="8.2" fill="url(#dialGrad)"/>

  <!-- Dial outer ring — main neon stroke -->
  <circle cx="18" cy="18" r="7.5"
          fill="none" stroke="#A855F7" stroke-width="1.65"
          filter="url(#neon)"/>

  <!-- Dial top-left arc highlight (simulates light source at top-left) -->
  <path d="M 12.3 13.2 A 7.5 7.5 0 0 1 22.8 12.3"
        fill="none" stroke="#D8B4FE" stroke-width="0.85"
        stroke-linecap="round" opacity="0.48"/>

  <!-- Dial cardinal tick marks -->
  <line x1="18"   y1="10.5" x2="18"   y2="12.2" stroke="#A855F7" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  <line x1="18"   y1="23.8" x2="18"   y2="25.5" stroke="#A855F7" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  <line x1="10.5" y1="18"   x2="12.2" y2="18"   stroke="#A855F7" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  <line x1="23.8" y1="18"   x2="25.5" y2="18"   stroke="#A855F7" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>

  <!-- Center knob: dark fill + neon ring -->
  <circle cx="18" cy="18" r="3.2" fill="#0b0717"/>
  <circle cx="18" cy="18" r="3.2"
          fill="none" stroke="#A855F7" stroke-width="1.1"
          filter="url(#tight)"/>

  <!-- Center dot -->
  <circle cx="18" cy="18" r="1.1" fill="#D8B4FE" opacity="0.95"/>

</svg>
