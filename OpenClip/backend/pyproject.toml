[project]
name = "openclip-backend"
version = "1.0.0"
description = "OpenClip backend — self-hosted AI short-form clip generator"
# 3.10 is the documented floor (README, launcher, setup scripts) — the ML wheels
# cap the top at 3.12. Keep this and the ruff target in sync with that range.
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Keep aliased imports in the same parenthesised block as their neighbours
# instead of exploding each `x as y` onto its own `from … import` line.
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = []
